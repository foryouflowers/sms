<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointillism Flower</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#9a8fb0;font-family:system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{width:min(94vw,calc(100vh - 96px));height:auto;aspect-ratio:1;background:#000;cursor:pointer}
  #lyr{min-height:24px;max-width:92vw;text-align:center;font:italic 400 clamp(14px,2.6vw,19px) Georgia,serif;color:#ead6ff;text-shadow:0 0 14px rgba(190,100,255,.6);transition:opacity .6s ease;opacity:0}
  #cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;height:16px}
  #bar{width:min(94vw,calc(100vh - 96px));height:2px;background:#1a1522}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 45%,#1d0a2e,#050208 75%);cursor:pointer}
  #start h1{margin:0;font:italic 400 clamp(26px,6vw,52px) Georgia,serif;color:#f0d9ff;letter-spacing:.08em;text-shadow:0 0 24px rgba(190,100,255,.55)}
  #start b{font:500 clamp(13px,2.4vw,17px) system-ui,sans-serif;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,#9b4de0,#d03fb8);border-radius:999px;padding:13px 28px;box-shadow:0 0 28px rgba(190,80,255,.5);animation:gl 1.8s ease-in-out infinite}
  @keyframes gl{50%{box-shadow:0 0 46px rgba(220,110,255,.9)}}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a3ad8,#ff9be8)}
</style>
</head>
<body>
<div id="start"><h1>Pointillism Flower</h1><b>♪ press to begin</b></div>
<canvas id="cv"></canvas>
<div id="bar"><i id="pg"></i></div>
<script>
// Pointillism Flower: JavaScript port of flow.py (soil -> stem -> leaves -> bloom); wilting phase removed
const S = 720, W = S, H = S, T_END = 30, HOLD = 8;
let seed = 5;
const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const N = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * R()); };
const U = (a, b) => a + (b - a) * R();
const cl = (x, a, b) => x < a ? a : x > b ? b : x;
const chs = (a, p) => { let r = R(), c = 0; for (let i = 0; i < a.length; i++) { c += p[i]; if (r < c) return a[i]; } return a[a.length - 1]; };
const sinc = x => Math.abs(x) < 1e-6 ? 1 : Math.sin(x) / x;
const prof = u => Math.pow(Math.sin(Math.PI * Math.pow(cl(u, 0, 1), .75)), .85);
const sstep = (x, a, b) => { const t = cl((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = (pal, g, sp = .55, jt = .07) => { const c = pal[cl(Math.round(cl(g, 0, 1) * (pal.length - 1) + N() * sp), 0, pal.length - 1)], k = 1 + N() * jt; return [c[0] * k, c[1] * k, c[2] * k]; };
const areaU = () => { for (;;) { const u = R(); if (R() < prof(u)) return u; } };
const sampV = (rim = .14) => { let v = U(-1, 1); if (R() < rim) v = Math.sign(v) * U(.88, 1); return v; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const KEYS = [[0,0,0,0,0,0,0],[5,.42,.22,0,0,.25,0],[10,.62,.42,0,0,.5,.35],[16,.8,.68,.5,0,.72,.55],[24,1,1,1,0,1,1],[30,1,1,1,0,1,1]];
const SOIL=[[34,25,20],[50,36,28],[68,50,37],[88,65,47],[108,82,60],[64,58,52]];
const STEM=[[62,38,120],[100,58,165],[140,84,200],[60,160,140]], STEMW=[[120,88,66],[96,66,52],[140,108,76]];
const LEAFP=[[60,150,140],[80,120,175],[130,80,195],[175,105,215]], LEAFW=[[130,100,70],[104,76,58],[146,116,84]];
const RIB=[[210,180,255],[170,230,220]], WILTP=[[150,86,128],[116,64,108],[88,52,88],[126,94,104],[104,72,56]];
const RIMP=[[205,165,255],[255,190,250],[170,140,255]], HI=[[235,215,255],[255,225,250]], GOLD=[[255,214,110],[255,238,170],[255,184,90]];
const STAM=[[255,240,255],[255,215,235],[255,230,150],[255,190,80]], STAMW=[[140,112,84],[120,96,72]];
const LAYERS=[
 {n:8,ac:.6,ao:1,kc:-1.2,ko:.45,L:1,wc:.2,wo:.34,d:1150,off:0,pal:[[210,80,225],[170,58,225],[128,50,218],[96,44,205],[78,42,185]]},
 {n:6,ac:.48,ao:.68,kc:-1.05,ko:.15,L:.88,wc:.19,wo:.31,d:950,off:.4,pal:[[255,150,235],[245,92,218],[205,62,218],[150,52,222]]},
 {n:5,ac:.36,ao:.46,kc:-.85,ko:-.05,L:.72,wc:.17,wo:.27,d:760,off:.2,pal:[[255,205,245],[255,135,232],[238,84,216],[195,62,226]]},
 {n:4,ac:.22,ao:.32,kc:-.5,ko:-.1,L:.46,wc:.14,wo:.22,d:480,off:.55,pal:[[255,238,252],[255,185,242],[255,125,228]]}];
const LEAFD=[[.10,1,1,.55,-.8],[.16,-1,.9,.5,-.85],[.40,1,.7,.95,-.7],[.33,-1,.62,.9,-.65]];

// splat offsets, sorted by distance (as in the original)
const OFFS=[]; for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(dx*dx+dy*dy<=9)OFFS.push([dx,dy]);
OFFS.sort((a,b)=>(a[0]**2+a[1]**2)-(b[0]**2+b[1]**2)||a[0]-b[0]||a[1]-b[1]);
const OX=OFFS.map(o=>o[0]), OY=OFFS.map(o=>o[1]), D2=OFFS.map(o=>o[0]**2+o[1]**2);
function splat(buf,x,y,r,g,b,rad,nmax=13){
  const xi=Math.round(x),yi=Math.round(y),lim=rad*rad+.01;
  for(let k=0;k<nmax;k++){ if(D2[k]>lim)break; const px=xi+OX[k],py=yi+OY[k]; if(px<0||px>=W||py<0||py>=H)continue; const i=(py*W+px)*4; buf[i]=r;buf[i+1]=g;buf[i+2]=b; }
}
function state(t){
  t=cl(t,0,T_END); let i=0; while(i<KEYS.length-1&&KEYS[i+1][0]<=t)i++; i=Math.min(i,KEYS.length-2);
  const u=(t-KEYS[i][0])/(KEYS[i+1][0]-KEYS[i][0]), K=j=>KEYS[cl(j,0,KEYS.length-1)], out=[];
  for(let c=1;c<7;c++){ const p0=K(i-1)[c],p1=K(i)[c],p2=K(i+1)[c],p3=K(i+2)[c];
    out.push(cl(.5*(2*p1+(p2-p0)*u+(2*p0-5*p1+4*p2-p3)*u*u+(3*p1-p0-3*p2+p3)*u**3),0,1)); }
  return out;
}
function bez(P,s){ const q=1-s,[P0,P1,P2,P3]=P;
  return [q**3*P0[0]+3*q*q*s*P1[0]+3*q*s*s*P2[0]+s**3*P3[0], q**3*P0[1]+3*q*q*s*P1[1]+3*q*s*s*P2[1]+s**3*P3[1],
    3*q*q*(P1[0]-P0[0])+6*q*s*(P2[0]-P1[0])+3*s*s*(P3[0]-P2[0]), 3*q*q*(P1[1]-P0[1])+6*q*s*(P2[1]-P1[1])+3*s*s*(P3[1]-P2[1])]; }

// ---------- build the plant ----------
const cx=W/2, y0=H*.8, Ls=H*.38, Lf=H*.235;
const surface=x=>y0-.022*H*Math.exp(-(((x-cx)/(.2*W))**2))-.003*H*Math.sin(x*.045)-.002*H*Math.sin(x*.13+1.3);
const RAD=()=>chs([1,1.5,2],[.4,.4,.2]);
const base=new Uint8ClampedArray(W*H*4); for(let i=3;i<base.length;i+=4)base[i]=255;
const edgeF=x=>Math.pow(cl(Math.min(x,W-x)/(.2*W),0,1),.8);
for(let i=0;i<26000;i++){ const x=U(0,W),d=Math.pow(R(),1.5)*.14*H,y=surface(x)+d,depth=d/(.14*H);
  const clump=.5+.5*Math.sin(x*.07+y*.05)*Math.sin(y*.11-x*.03);
  const br=Math.pow(1-depth,.8)*edgeF(x)*(.55+.35*clump+.35*R()), c=pick(SOIL,R(),1);
  splat(base,x,y,c[0]*br,c[1]*br,c[2]*br,RAD()); }
for(let i=0;i<170;i++){ const px=U(.05*W,.95*W),py=surface(px)+Math.pow(R(),1.3)*.1*H,e=edgeF(px);
  const c=pick([[58,52,48],[84,74,64],[104,90,76],[46,38,32]],R(),.7); splat(base,px,py,c[0]*e,c[1]*e,c[2]*e,chs([2,3],[.6,.4]),29); }
const craters=Array.from({length:520},()=>{ const x=cx+N()*.03*H; return {x,y:surface(x)-R()*.006*H,amp:H*.05*Math.pow(R(),2.2),delay:U(0,2.5),c:pick(SOIL,U(.3,1),.8).map(v=>v*.8),rad:RAD()}; });
const stem=shuffle(Array.from({length:3600},()=>{ const s=R(); let lat=U(-1,1); if(R()<.18)lat=Math.sign(lat)*U(.85,1);
  let live=pick(STEM.slice(0,3),s*.8+R()*.2); if(R()<.12){const k=1+N()*.08;live=STEM[3].map(v=>v*k);}
  return {s,lat,live,wilt:pick(STEMW,R(),.8),rn:R(),rad:chs([1,1.5,2],[.35,.45,.2])}; }));
const headArr=[];
for(const Ly of LAYERS)for(let i=0;i<Ly.n;i++){ const pt={th:2*Math.PI*i/Ly.n+Ly.off+N()*.1,aj:N()*.06,pj:R(),wj:U(-.5,.5),Ly,lj:U(.92,1.08)};
  for(let k=0;k<Ly.d;k++){ const u=areaU(),v=sampV(); let live=pick(Ly.pal,u+N()*.1);
    if(Math.abs(v)>.86&&R()<.55)live=pick(RIMP,R()); if(R()<.04)live=pick(HI,R()); if(R()<.02&&u<.55)live=pick(GOLD,R());
    headArr.push({pt,u,v,live,wilt:pick(WILTP,.4*u+.6*R(),.7),rn:R(),rad:chs([1,1.5,2],[.3,.45,.25]),sp:prof(u)}); } }
shuffle(headArr);
const fils=Array.from({length:60},()=>({th:U(0,6.2832),beta:U(.2,.85),ell:U(.3,.55)}));
const stam=shuffle(Array.from({length:700},()=>{ const t=1-Math.pow(R(),1.6); return {f:fils[Math.floor(R()*60)],t,live:pick(STAM,t,.35),wilt:pick(STAMW,R(),.6),rad:t>.88?2:chs([1,1.5],[.5,.5])}; }));
const leaves=[]; for(let j=0;j<4;j++)for(let k=0;k<900;k++){ const u=areaU(); let v=sampV(.1),rib=R()<.09; if(rib)v=N()*.03;
  leaves.push({j,u,v,live:rib?pick(RIB,R()):pick(LEAFP,u+N()*.1),wilt:pick(LEAFW,R(),.8),rn:R(),rad:chs([1,1.5,2],[.35,.45,.2])}); }
shuffle(leaves);
const halo=shuffle(Array.from({length:1800},()=>{ const r=Math.min(Math.abs(N()*.55),1.6); return {a:U(0,6.2832),r,b:Math.pow(1-r/1.6,1.5)*.55,fl:R()}; }));
const ring=[]; for(let j=0;j<7;j++){ const m=j?170:700; for(let k=0;k<m;k++)ring.push({cf:j?.5:0,cj:Math.max(j-1,0),rho:j?.5:1,a:U(0,6.2832),fl:R()}); } shuffle(ring);
const spark=Array.from({length:280},()=>({a:U(0,6.2832),rho:R(),ph:R(),sp:U(.6,1.4),rad:chs([1,2],[.7,.3]),hue:R()}));
const fall=Array.from({length:260},()=>{ const xl=cx+N()*.12*H; return {r0:R(),ox:N(),oy:N(),xl,yl:surface(xl)-R()*.012*H,ph:U(0,6.28),col:pick(WILTP,R(),.8),rad:chs([1.5,2],[.5,.5])}; });

// ---------- render ----------
const CAP=48000, bx=new Float32Array(CAP),by=new Float32Array(CAP),bz=new Float32Array(CAP),bc=new Float32Array(CAP*3),brd=new Float32Array(CAP);
let nb=0;
const add=(x,y,r,g,b,rad,z)=>{ if(nb>=CAP)return; bx[nb]=x;by[nb]=y;bz[nb]=z;bc[nb*3]=r;bc[nb*3+1]=g;bc[nb*3+2]=b;brd[nb]=rad;nb++; };
const addMix=(x,y,l,w,k,s,rad,z)=>add(x,y,(l[0]+(w[0]-l[0])*k)*s,(l[1]+(w[1]-l[1])*k)*s,(l[2]+(w[2]-l[2])*k)*s,rad,z);
const cv=document.getElementById('cv'); cv.width=W; cv.height=H;
const g=cv.getContext('2d'), img=g.createImageData(W,H), px=img.data;
const order=new Uint32Array(CAP), cnt=new Uint32Array(4097);
function flush(){
  cnt.fill(0); const q=new Uint16Array(nb);
  for(let i=0;i<nb;i++){ q[i]=cl(Math.floor((bz[i]+2100)/4200*4095),0,4095); cnt[q[i]+1]++; }
  for(let i=0;i<4096;i++)cnt[i+1]+=cnt[i];
  for(let i=0;i<nb;i++)order[cnt[q[i]]++]=i;
  for(let k=0;k<nb;k++){ const i=order[k]; splat(px,bx[i],by[i],bc[i*3],bc[i*3+1],bc[i*3+2],brd[i],13); }
  nb=0;
}
function render(t){
  const [st,size,bloom,wilt,leaf,glow]=state(t); px.set(base);
  const L=Ls*st, sway=.012*H*Math.sin(t*.9)*st*(1-.6*wilt);
  const P=[[cx,y0+4],[cx-.06*L*(1-wilt)+.02*L*wilt,y0-.33*L],[cx+.05*L*(1-wilt)+.08*L*wilt+sway*.5,y0-L*(.74+.3*wilt)],[cx+sway+.32*L*wilt,y0-L*(1-.15*wilt)]];
  const [hx,hy]=P[3];
  if(st>.01){ const nv=Math.floor(stem.length*cl(st,.08,1));
    for(let i=0;i<nv;i++){ const a=stem[i],[x,y,dx,dy]=bez(P,a.s),nn=Math.hypot(dx,dy)+1e-6;
      const w=.0085*H*(1-.3*a.s)*(1-.25*wilt)*cl(.4+st*1.2,.4,1), lat=a.lat*w, wi=cl(wilt*(.75+.5*a.s)*(.7+.5*a.rn),0,1);
      addMix(x-dy/nn*lat,y+dx/nn*lat,a.live,a.wilt,wi,1,a.rad,-500); } }
  if(leaf>.02&&st>.05){ const nv=Math.floor(leaves.length*cl(leaf,.15,1)), A=LEAFD.map(d=>bez(P,d[0]));
    for(let i=0;i<nv;i++){ const a=leaves[i],d=LEAFD[a.j],m=d[1],a0=d[3]+(1-leaf)*.8-.6*wilt,c=d[4]-.5*wilt;
      const LL=.19*H*d[2]*leaf*(1-.25*wilt),am=a0+c*a.u*.5,al=a0+c*a.u,sc=sinc(c*a.u*.5),lat=a.v*.27*LL*prof(a.u);
      const X=A[a.j][0]+LL*a.u*m*Math.cos(am)*sc-lat*Math.sin(al), Yu=LL*a.u*Math.sin(am)*sc+lat*m*Math.cos(al);
      addMix(X,A[a.j][1]-Yu,a.live,a.wilt,cl(wilt*(.9+.5*a.u+.3*a.rn)-.1,0,1),1,a.rad,-450); } }
  const nodes=[];
  if(st>.01&&size>.05){
    const phi=wilt*2.75+.035*Math.sin(t*.9+1)*(1-wilt), tau=.2+.36*bloom-.4*wilt;
    const cp=Math.cos(phi),sp=Math.sin(phi),ct=Math.cos(tau),st_=Math.sin(tau),Lz=Lf*size;
    const proj=(xl,yl,zl)=>{ const yp=yl*ct-zl*st_; return [hx+xl*cp+yp*sp, hy-(-xl*sp+yp*cp), yl*st_+zl*ct]; };
    const nv=Math.floor(headArr.length*cl(size*size*1.15,.2,1));
    for(let i=0;i<nv;i++){ const h=headArr[i],p=h.pt,Ly=p.Ly;
      let A0=Ly.ac+(Ly.ao-Ly.ac)*bloom+p.aj; A0=A0*(1-.55*wilt)+wilt*p.wj*.3;
      const K=Ly.kc+(Ly.ko-Ly.kc)*bloom+wilt*(.6+.6*p.pj), Lp=Lz*Ly.L*p.lj*(1-.28*wilt*p.pj);
      const am=A0+K*h.u*.5,sc=sinc(K*h.u*.5), rr0=Lp*h.u*Math.sin(am)*sc, hh=Lp*h.u*Math.cos(am)*sc;
      const lat=h.v*(Ly.wc+(Ly.wo-Ly.wc)*bloom)*Lp*h.sp, rr=rr0+.025*Lz-.5*lat*lat/(Lp+1);
      const ch=Math.cos(p.th),sh=Math.sin(p.th),[X,Y,zp]=proj(ch*rr-sh*lat,hh,sh*rr+ch*lat);
      const shade=cl(.72+.28*cl(zp/Lz*.5+.5,0,1)+.12*(hh/Lz),.5,1.2);
      addMix(X,Y,h.live,h.wilt,cl(wilt*(1+.7*h.u+.4*h.rn)-.2,0,1),shade,h.rad,zp); }
    const ss=sstep(bloom,.3,.85);
    if(ss>.02){ const n2=Math.floor(stam.length*cl(size*size,.25,1));
      for(let i=0;i<n2;i++){ const a=stam[i],f=a.f,ell=Lz*ss*f.ell,beta=f.beta*(.6+.4*bloom)+wilt*.3;
        const r=ell*a.t*Math.sin(beta)+.02*Lz, yl=.05*Lz+ell*a.t*Math.cos(beta), [X,Y,zp]=proj(Math.cos(f.th)*r,yl,Math.sin(f.th)*r);
        addMix(X,Y,a.live,a.wilt,wilt,1,a.rad,zp+3); } }
    if(glow>.02){ const ccx=hx+Math.sin(phi)*.5*Lz, ccy=hy-Math.cos(phi)*.5*Lz;
      const nh=Math.floor(halo.length*glow);
      for(let i=0;i<nh;i++){ const a=halo[i],rh=a.r*Lz*1.1,br=a.b*glow*(.85+.3*Math.sin(t*1.3+a.fl*6.28));
        add(ccx+Math.cos(a.a)*rh,ccy+Math.sin(a.a)*rh,150*br,70*br,240*br,1,-2000); }
      const nr=Math.floor(ring.length*glow),Rs=Lz*1.25;
      for(let i=0;i<nr;i++){ const a=ring[i],cang=2*Math.PI*a.cj/6+t*.15,an=a.a+t*.05,bb=(.4+.6*glow)*(.65+.35*Math.sin(t*2+a.fl*20));
        add(ccx+Rs*(a.cf*Math.cos(cang)+a.rho*Math.cos(an)),ccy+Rs*(a.cf*Math.sin(cang)+a.rho*Math.sin(an)),210*bb,145*bb,255*bb,1,-1500); }
      for(let k=0;k<6;k++){ const ja=2*Math.PI*k/6+t*.15; nodes.push([ccx+Rs*Math.cos(ja),ccy+Rs*Math.sin(ja),255*glow,215*glow,255*glow]); }
      for(const s of spark){ const life=(t*.1*s.sp+s.ph)%1, rho=(.25+1.15*s.rho)*Lz*(.6+.6*life), bs=Math.pow(Math.sin(Math.PI*life),.8)*glow;
        const c=s.hue<.5?[255,215,255]:[255,150,235];
        add(ccx+Math.cos(s.a)*rho,ccy+Math.sin(s.a)*rho-life*.25*Lz,c[0]*bs,c[1]*bs,c[2]*bs,s.rad,2000); } }
    if(wilt>.02) for(const F of fall){ const f=cl((wilt*1.05-F.r0*.7)/.35,0,1); if(f<=0)continue;
      const sx=hx+F.ox*.18*Lz, sy=hy+F.oy*.18*Lz+.25*Lz;
      add(sx+(F.xl-sx)*f+Math.sin(f*6.28+F.ph)*.03*H*(1-f), sy+(F.yl-sy)*f*f, F.col[0],F.col[1],F.col[2],F.rad,500); }
  }
  flush();
  for(const n of nodes)splat(px,n[0],n[1],n[2],n[3],n[4],3,29);
  for(const c of craters){ const e=cl((t-c.delay)/3,0,1); splat(px,c.x,c.y-c.amp*Math.sin(Math.PI*e),c.c[0],c.c[1],c.c[2],c.rad); }
  g.putImageData(img,0,0);
}

// ---------- player ----------
const PHASES=[[0,'tuproq'],[5,'novda'],[10,'poya'],[16,'barglar'],[24,'gullash'],[30,'to‘liq gul']];
const pg=document.getElementById('pg');
let tt=0, paused=false, started=false, last=performance.now();
document.getElementById('start').onclick=e=>{ started=true; tt=0; e.currentTarget.style.display='none'; startMusic(); };
addEventListener('keydown',e=>{ if(e.code==='Space'){paused=!paused;e.preventDefault();} else if(e.key==='r'||e.key==='R')tt=0; });
cv.addEventListener('click',()=>{ paused=!paused; });
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(started&&!paused)tt+=dt;                       // after full bloom the clock keeps running: the flower keeps swaying and glowing
  const t=Math.min(tt,T_END); render(tt);
  pg.style.width=(t/T_END*100)+'%'; pg.parentNode.style.opacity=tt>T_END?0:1;
  requestAnimationFrame(loop);
}
